name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  compose-smoke:
    # Seed of acceptance gate 3 (plan 04): full stack up, health-gated, torn down.
    # Grows into the Playwright suite in Phase 5.
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - name: Start backing services
        run: docker compose up -d postgres nats
      - name: Apply schema (fresh CI database; interim until plan 03 migrations)
        run: docker compose run --rm --workdir /app api npx prisma db push --schema packages/db/prisma/schema.prisma
      - name: Build and start the stack
        run: docker compose up -d --build
      - name: Wait for API health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:666/api/health >/dev/null; then
              echo "API healthy"; exit 0
            fi
            sleep 5
          done
          echo "API never became healthy"
          exit 1
      - name: Check web UI serves
        run: curl -fsS http://localhost:666/ -o /dev/null
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v
