[djx_spark]
djx-spark ansible_host=spark-ddb1 ansible_user=sparks ansible_ssh_private_key_file=~/.ssh/id_rsa ansible_python_interpreter=/usr/bin/python3

[feedeater]
# AMD64 VM on the Teleport cluster — app deploy target via the pull-based deploy
# agent (replaces djx_spark, which remains inference-only for vLLM).
# Reached through the tbot identity (see the teleport-ssh skill); Ansible rides the
# tbot-generated ssh_config, so no direct SSH key is needed.
feedeater-vm ansible_host=feedeater.teleport.sparks.works ansible_user=sparks ansible_ssh_common_args='-F /opt/machine-id/openchamber/ssh_config' ansible_python_interpreter=/usr/bin/python3


