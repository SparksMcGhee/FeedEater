- name: Create install directory
  ansible.builtin.file:
    path: "{{ feedeater_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy FeedEater project files (rsync)
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../"
    dest: "{{ feedeater_root }}/"
    delete: no
    rsync_opts:
      - "--exclude=.git"
      - "--exclude=node_modules"
      - "--exclude=dist"
      - "--exclude=.next"
      - "--exclude=out"
      - "--exclude=*.log"
      - "--exclude=.env"
      - "--exclude=ansible"

- name: Write .env from deployment vars
  ansible.builtin.template:
    src: env.j2
    dest: "{{ feedeater_root }}/.env"
    owner: root
    group: docker
    mode: "0640"
  no_log: true

- name: Pull images
  ansible.builtin.command:
    chdir: "{{ feedeater_root }}"
    cmd: docker compose pull
  register: pull_result
  changed_when: "'Downloaded newer image' in pull_result.stdout or pull_result.rc == 0"

- name: Build and start services
  ansible.builtin.command:
    chdir: "{{ feedeater_root }}"
    cmd: docker compose up -d --build

- name: Apply Prisma schema (idempotent)
  ansible.builtin.command:
    chdir: "{{ feedeater_root }}"
    cmd: docker compose run --rm --workdir /app api npx prisma db push --schema packages/db/prisma/schema.prisma
